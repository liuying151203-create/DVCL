[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvcl-bench"
version = "0.1.0"
description = "Reproducible robustness benchmark for DVCL and heterogeneous GNN baselines"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.2.2",
  "matplotlib==3.8.4",
  "PyYAML==6.0.1",
  "scikit-learn==1.4.2",
  "tqdm==4.66.4",
]

[project.optional-dependencies]
torch = [
  "torch==2.1.2",
  "torchvision==0.16.2",
  "torchaudio==2.1.2",
  "torch-geometric==2.5.3",
]
dev = ["pytest>=8,<9"]
openhgnn = [
  "ogb==1.3.6",
  "optuna==4.9.0",
  "colorama==0.4.6",
  "tensorboard==2.21.0",
  "lmdb==2.3.0",
  "ordered-set==4.1.0",
  "python-igraph==1.0.0",
  "openhgnn @ git+https://github.com/BUPT-GAMMA/OpenHGNN.git@27a483eeb25e5cdfb3be81ab66ba8ef8b3cf73a3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
