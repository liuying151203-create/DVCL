[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvcl-bench"
version = "0.1.0"
description = "Reproducible robustness benchmark for DVCL and heterogeneous GNN baselines"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.2.2",
  "PyYAML==6.0.1",
  "scikit-learn==1.4.2",
  "tqdm==4.66.4",
]

[project.optional-dependencies]
torch = [
  "torch==2.1.2",
  "torchvision==0.16.2",
  "torchaudio==2.1.2",
  "torch-geometric==2.5.3",
]
dev = ["pytest>=8,<9"]
openhgnn = ["openhgnn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
