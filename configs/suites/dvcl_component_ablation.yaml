suite: dvcl_component_ablation
protocol: dvcl_main
dataset: acm
model: dvcl
backend: native
split_name: paper_seed_1
split_seed: 1
attack_seed: 1
device: cuda:0
training:
  epochs: 200
  patience: 100
variants:
  - name: full
    model_config:
      view_mode: both
      lambda_dvcl: 1.0
  - name: no_cl
    model_config:
      view_mode: both_nocl
      lambda_dvcl: 0.0
  - name: topology_only
    model_config:
      view_mode: topo
      lambda_dvcl: 0.0
  - name: feature_only
    model_config:
      view_mode: feat
      lambda_dvcl: 0.0
attacks:
  - name: clean
    rates: [0]
  - name: prbcd
    rates: [5, 15, 25]
  - name: heteprbcd
    rates: [5, 15, 25]
train_seeds: [1, 2, 3, 4, 5]
