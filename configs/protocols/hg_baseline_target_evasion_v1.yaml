protocol: hg_baseline_target_evasion_v1
device: cuda:0

datasets:
  - acm
  - dblp

models:
  - name: han
    backend: native
    config_path: configs/models/han.yaml
  - name: heterosage
    backend: native
    config_path: configs/models/heterosage.yaml
  - name: rohe
    backend: native
    config_path: configs/models/rohe.yaml
  - name: heteroguard
    backend: native
    config_path: configs/models/heteroguard.yaml
  - name: fastrohgcn
    backend: native
    config_path: configs/models/fastrohgcn.yaml
  - name: hseco
    backend: native
    config_path: configs/models/hseco_native.yaml
  - name: dvcl
    backend: native
    config_path: configs/models/dvcl.yaml

split_name_pattern: paper_seed_{seed}

attacks:
  - name: hg_baseline
    rates: [1, 3, 5]
    threat_model: evasion
    scope: target
    adaptive: false

seeds:
  split: [1]
  attack: [1]
  train: [1, 2, 3, 4, 5]

training:
  epochs: 200
  patience: 100
