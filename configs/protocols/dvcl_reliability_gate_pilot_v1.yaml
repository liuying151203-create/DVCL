protocol: dvcl_reliability_gate_pilot_v1
device: cuda:0

datasets:
  - acm
  - dblp
  - aminer

model: dvcl
backend: native
model_config_path: configs/models/dvcl.yaml
split_name_pattern: paper_seed_{seed}
checkpoint_pattern: outputs/runs/dvcl_reliability_gate_clean_pilot_v1/{dataset}/dvcl/{model_variant}/clean/rate_0/split_seed_{split_seed}/attack_seed_1/train_seed_{train_seed}/checkpoint.pt
evaluation_budgets: [1, 3, 5]

variants:
  - name: reliability_gate
    model_config:
      view_mode: both
      fusion_mode: reliability_gate
      gate_hidden_dim: 16
      route_temperature: 1.0
      lambda_dvcl: 1.0
      beta_aux: 0.5
      lambda_route: 1.0

attacks:
  - name: hg_baseline
    rates: [1, 3, 5]
    threat_model: evasion
    scope: target
    adaptive: false
  - name: adaptive_query
    variant: cand_64
    rates: [5]
    threat_model: evasion
    scope: target
    adaptive: true
    path_pattern: outputs/attacks/adaptive_requests_v1/cand_64/{dataset}/adaptive_query/rate_{rate}/seed_{attack_seed}/attack.pt

seeds:
  split: [1]
  pairs:
    - attack: 1
      train: 1

training:
  epochs: 200
  patience: 100
