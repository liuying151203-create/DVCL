protocol: robust_baselines_poisoning_v1
device: cuda:0

datasets:
  - acm
  - dblp

models:
  - name: rohe
    backend: native
    config_path: configs/models/rohe.yaml
  - name: heteroguard
    backend: native
    config_path: configs/models/heteroguard.yaml
  - name: fastrohgcn
    backend: native
    config_path: configs/models/fastrohgcn.yaml

split_name_pattern: paper_seed_{seed}

attacks:
  - name: clean
    threat_model: poisoning
    scope: global
  - name: prbcd
    rates: [5, 10, 15, 20, 25]
    threat_model: poisoning
    scope: global
  - name: heteprbcd
    rates: [5, 10, 15, 20, 25]
    threat_model: poisoning
    scope: global

seeds:
  split: [1]
  attack: [1]
  train: [1, 2, 3, 4, 5]

training:
  epochs: 200
  patience: 100
