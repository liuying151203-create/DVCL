protocol: model_efficiency_v1
device: cuda:0

datasets:
  - acm
  - dblp
  - aminer

models:
  - name: han
    backend: native
    config_path: configs/models/han.yaml
  - name: heterosage
    backend: native
    config_path: configs/models/heterosage.yaml
  - name: rohe
    backend: native
    config_path: configs/models/rohe.yaml
  - name: heteroguard
    backend: native
    config_path: configs/models/heteroguard.yaml
  - name: fastrohgcn
    backend: native
    config_path: configs/models/fastrohgcn.yaml
  - name: hgt
    backend: openhgnn
    config_path: configs/models/hgt.yaml
  - name: magnn
    backend: openhgnn
    config_path: configs/models/magnn.yaml
  - name: heco
    backend: openhgnn
    config_path: configs/models/heco.yaml
  - name: simplehgn
    backend: openhgnn
    config_path: configs/models/simplehgn.yaml
  - name: hseco
    backend: native
    config_path: configs/models/hseco_native.yaml
  - name: dvcl
    backend: native
    config_path: configs/models/dvcl.yaml

split_name_pattern: paper_seed_{seed}

attacks:
  - name: clean
    threat_model: poisoning
    scope: global

seeds:
  split: [1]
  attack: [1]
  train: [1, 2, 3]

training:
  epochs: 200
  patience: 100

profiling:
  enabled: true
  inference_warmup: 10
  inference_repetitions: 50

measurement:
  concurrency: 1
  exclusive_gpu: true
  training_scope: trainer_pipeline_excluding_profile_repetitions
  inference_scope: post_preprocessing_full_graph_forward
  query_cost_source: adaptive_target_evasion_v1
