protocol: openhgnn_baselines_poisoning_v1
device: cuda:0

datasets:
  - acm
  - dblp

models:
  - name: hgt
    backend: openhgnn
    config_path: configs/models/hgt.yaml
  - name: magnn
    backend: openhgnn
    config_path: configs/models/magnn.yaml
  - name: heco
    backend: openhgnn
    config_path: configs/models/heco.yaml
  - name: simplehgn
    backend: openhgnn
    config_path: configs/models/simplehgn.yaml

split_name_pattern: paper_seed_{seed}

attacks:
  - name: clean
    threat_model: poisoning
    scope: global
  - name: prbcd
    rates: [5, 10, 15, 20, 25]
    threat_model: poisoning
    scope: global
  - name: heteprbcd
    rates: [5, 10, 15, 20, 25]
    threat_model: poisoning
    scope: global

seeds:
  split: [1]
  attack: [1]
  train: [1, 2, 3, 4, 5]

training:
  epochs: 200
  patience: 100
